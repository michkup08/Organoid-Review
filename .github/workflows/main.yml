name: Organoid CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj zależności
        run: |
          cd Organoid-Review-Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Sprawdź błędy w kodzie
        run: |
          cd Organoid-Review-Backend
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Zainstaluj zależności i Zbuduj
        run: |
          cd Organoid-Review-Frontend
          npm ci  # Czysta instalacja (Clean Install)
          npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj .env
        run: cp .env.example .env

      - name: Sprawdź czy kontenery się budują
        run: docker compose build