services:
  backend:
    build: ./Organoid-Review-Backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./Organoid-Review-Backend:/app
      - ${DATA_PATH_HOST}:/app/data
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD} 
      - DB_NAME=${DB_NAME}

    depends_on:
      - db

  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
  frontend:
    build:
      context: ./Organoid-Review-Frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./Organoid-Review-Frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
      - VITE_GEMINI_KEY=${VITE_GEMINI_KEY}
    depends_on:
      - backend
    stdin_open: true
    tty: true
volumes:
  db_data: